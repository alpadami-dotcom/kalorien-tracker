<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalorien">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161714" media="(prefers-color-scheme: dark)">
<title>Kalorien</title>
<link rel="stylesheet" href="stil.css">
<link rel="manifest" href="manifest.webmanifest">
<!-- Neues Symbol = neuer Dateiname: iOS merkt sich Symbole pro Adresse. -->
<link rel="apple-touch-icon" href="icon-blau-180.png">
<link rel="icon" href="icon-blau-192.png">
</head>
<body>

<header class="kopf">
  <button class="pfeil" id="tag-zurueck" aria-label="Vorheriger Tag">‹</button>
  <button class="datum" id="datum">Heute</button>
  <button class="pfeil" id="tag-vor" aria-label="Nächster Tag">›</button>
  <button class="zahnrad" id="einstellungen-knopf" aria-label="Profil und Ziele">⚙︎</button>
</header>

<main>
  <section class="bilanz">
    <div class="kcal-zeile">
      <div>
        <div class="kcal-zahl" id="kcal-gegessen">0</div>
        <div class="klein">kcal gegessen</div>
      </div>
      <button class="rest" id="ziel-knopf">
        <div class="kcal-rest" id="kcal-rest">2000</div>
        <div class="klein" id="rest-text">übrig von 2000</div>
      </button>
    </div>
    <div class="balken"><div id="kcal-balken"></div></div>
    <div class="makros">
      <div><span class="punkt p"></span><b id="m-protein">0</b> g Protein</div>
      <div><span class="punkt k"></span><b id="m-kh">0</b> g Kohlenh.</div>
      <div><span class="punkt f"></span><b id="m-fett">0</b> g Fett</div>
    </div>
  </section>

  <section class="wasser">
    <div class="wasser-kopf">
      <span>Wasser</span>
      <span class="klein"><b id="wasser-stand">0</b> / <span id="wasser-ziel">3</span> L</span>
    </div>
    <div class="glaeser" id="glaeser"></div>
  </section>

  <section class="eingabe">
    <form id="text-form" autocomplete="off">
      <input id="text" type="text" enterkeyhint="send"
             placeholder="z. B. 2 mittelgroße Bananen">
      <button type="submit" id="senden" aria-label="Eintragen">➜</button>
    </form>
    <div class="knoepfe">
      <label class="knopf" id="foto-knopf">
        <input type="file" accept="image/*" capture="environment" id="foto" hidden>
        📷 Foto vom Essen
      </label>
      <label class="knopf">
        <input type="file" accept="image/*" capture="environment" id="barcode-foto" hidden>
        ▥ Barcode
      </label>
    </div>
    <div class="hinweis" id="ki-hinweis" hidden>
      Tippe z. B. „2 Bananen“ oder „200 g Hähnchen“ – Enter trägt den obersten Treffer ein.
    </div>
    <ul class="vorschlaege" id="vorschlaege"></ul>
  </section>

  <section id="mahlzeiten"></section>
</main>

<!-- Pruefen: was die KI / Suche / der Barcode gefunden hat, vor dem Eintragen -->
<dialog id="pruefen">
  <form method="dialog" class="blatt">
    <h2 id="pruefen-titel">Prüfen</h2>
    <p class="rueckfrage" id="rueckfrage" hidden></p>
    <div class="segmente" id="mahlzeit-wahl" role="radiogroup" aria-label="Mahlzeit"></div>
    <ul id="kandidaten"></ul>
    <div class="summe" id="pruefen-summe"></div>
    <div class="aktionen">
      <button value="abbruch" class="zweit">Abbrechen</button>
      <button value="ok" id="eintragen" class="erst">Eintragen</button>
    </div>
  </form>
</dialog>

<!-- Profil und Ziele -->
<dialog id="einstellungen">
  <form method="dialog" class="blatt">
    <h2>Profil &amp; Ziele</h2>

    <h3>Kalorienbedarf berechnen</h3>
    <div class="segmente" id="geschlecht" role="radiogroup" aria-label="Geschlecht">
      <button type="button" data-wert="m">Männlich</button>
      <button type="button" data-wert="w">Weiblich</button>
    </div>
    <div class="felder">
      <label>Alter<input id="p-alter" type="number" inputmode="numeric" min="10" max="100" placeholder="Jahre"></label>
      <label>Größe (cm)<input id="p-groesse" type="number" inputmode="numeric" min="100" max="230" placeholder="cm"></label>
      <label>Gewicht (kg)<input id="p-gewicht" type="text" inputmode="decimal" placeholder="kg"></label>
    </div>
    <label class="zeile">Wie aktiv bist du?
      <select id="p-aktivitaet">
        <option value="1.2">Kaum – Schreibtisch, kein Sport</option>
        <option value="1.375">Leicht – 1–3× Sport pro Woche</option>
        <option value="1.55">Mittel – 3–5× Sport pro Woche</option>
        <option value="1.725">Viel – 6–7× Sport pro Woche</option>
        <option value="1.9">Sehr viel – körperliche Arbeit + Sport</option>
      </select>
    </label>
    <label class="zeile">Dein Ziel
      <select id="p-ziel">
        <option value="-500">Abnehmen (ca. 0,5 kg pro Woche)</option>
        <option value="-250">Langsam abnehmen (ca. 0,25 kg pro Woche)</option>
        <option value="0">Gewicht halten</option>
        <option value="250">Langsam zunehmen</option>
        <option value="500">Zunehmen / Muskelaufbau</option>
      </select>
    </label>
    <div class="ergebnis" id="ergebnis">Gib Alter, Größe und Gewicht ein.</div>
    <button type="button" class="erst breit" id="uebernehmen" hidden>Als Kalorienziel übernehmen</button>

    <h3>Tagesziele</h3>
    <div class="felder zwei">
      <label>Kalorien<input id="z-kcal" type="number" inputmode="numeric" min="800" max="6000" step="10"></label>
      <!-- Kommazahlen als Text: type="number" verwirft "2,5" in manchen Browsern stillschweigend. -->
      <label>Wasser (Liter)<input id="z-wasser" type="text" inputmode="decimal"></label>
    </div>

    <div class="aktionen eins">
      <button value="ok" id="fertig" class="erst">Fertig</button>
    </div>
  </form>
</dialog>

<div class="laden" id="laden" hidden><div class="kreisel"></div><span id="laden-text">Einen Moment …</span></div>
<div class="meldung" id="meldung" hidden></div>

<script src="naehrwerte.js"></script>
<script src="app.js"></script>
</body>
</html>
